<body class="relative flex items-center justify-center min-h-screen">

    <!-- Canvas para animación de Gotas de Agua -->
    <canvas id="waterCanvas"></canvas>

    <!-- Tarjeta de Login Centrada -->
    <div class="opdapas-card p-8 m-4 relative pointer-events-auto">
        <!-- Logo Header -->
        <div class="logo-container text-center mb-4">
            <img src="desktop-logo (1).png" alt="Logo OPDAPAS">
        </div>

        <h2 class="opdapas-title text-center text-xl font-bold text-gray-900 mb-4">Inicio de sesión</h2>

        
        <form action="procesar_login.php" method="POST" class="space-y-4">
            
            <div>
                <label class="block text-xs font-bold text-gray-800 mb-1">Correo electrónico</label>
                <div class="relative">
                    <input type="email" name="correo" placeholder="xxxxxx@gmail.com" class="input-field w-full pr-10" required>
                </div>
            </div>

            
            <div>
                <label class="block text-xs font-bold text-gray-800 mb-1">Contraseña</label>
                <div class="relative">
                    <input id="passwordInput" type="password" name="contraseña" placeholder="Ingresa tu contraseña" class="input-field w-full pr-10" required>
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-900 p-1">
                        <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Selector de Roles -->
            <div>
                <label class="block text-xs font-bold text-gray-800 mb-2">Seleccionar el rol correspondiente</label>
                <div class="flex items-center justify-around bg-gray-50 p-2.5 rounded-2xl border border-gray-100">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="rol" value="Direccion_General" checked class="w-4 h-4 text-sky-500 focus:ring-sky-400">
                        <span class="text-xs font-bold text-gray-800">Dirección Gral.</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="rol" value="Infraestructura_Hidraulica" class="w-4 h-4 text-sky-500 focus:ring-sky-400">
                        <span class="text-xs font-bold text-gray-800">Infraestructura</span>
                    </label>
                </div>
            </div>

            <!-- Botón de Enviar -->
            <button type="submit" class="btn-opdapas w-full py-3 text-white text-sm font-bold mt-2">
                Iniciar sesión
            </button>

            <!-- Registro -->
            <div class="text-center pt-2">
                <span class="text-xs text-gray-500">o</span>
                <br>
                <a href="registro.php" class="opdapas-title text-sm text-sky-600 font-bold underline hover:text-sky-700 transition">
                    Regístrate
                </a>
            </div>
        </form>
    </div>

    <script>
        const canvas = document.getElementById('waterCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initDroplets();
        });

        // Posición del mouse
        const mouse = { x: -1000, y: -1000, radius: 100 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // Mostrar / Ocultar contraseña
        function togglePasswordVisibility() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash text-sm';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye text-sm';
            }
        }

       
    </script>
